<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymTrack — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1A1C1F;
    --surface: #24262B;
    --surface-2: #2C2F35;
    --border: #34373D;
    --text: #EDEEF0;
    --muted: #8B8D93;
    --accent: #E8A73C;
    --active: #5FA777;
    --expiring: #D9A441;
    --expired: #C1554B;
    --none: #6B6E76;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: 48px 32px 80px;
    max-width: 960px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 40px;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }
  .refresh-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .refresh-btn:hover { border-color: var(--accent); }
  .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 48px;
  }
  .stat {
    background: var(--surface);
    padding: 20px 18px;
  }
  .stat .value {
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
  }
  .stat .label {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }
  .stat.active .value { color: var(--active); }
  .stat.expiring .value { color: var(--expiring); }
  .stat.expired .value { color: var(--expired); }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 16px;
    color: var(--text);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  thead th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    font-size: 12px;
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--border);
  }
  tbody td {
    padding: 14px 12px;
    border-bottom: 1px solid var(--border);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }

  .member-name { font-weight: 500; }
  .member-phone { color: var(--muted); font-variant-numeric: tabular-nums; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
  }
  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status.active .dot { background: var(--active); }
  .status.expiring_soon .dot { background: var(--expiring); }
  .status.expired .dot { background: var(--expired); }
  .status.none .dot { background: var(--none); }
  .status.active span.label { color: var(--active); }
  .status.expiring_soon span.label { color: var(--expiring); }
  .status.expired span.label { color: var(--expired); }
  .status.none span.label { color: var(--muted); }

  .plan-name { color: var(--text); }
  .plan-none { color: var(--muted); font-style: italic; }

  .state-message {
    padding: 40px 12px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  .state-message.error { color: var(--expired); }
  .state-message a { color: var(--accent); }

  @media (max-width: 720px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    body { padding: 32px 20px 60px; }
    thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

  <header>
    <div>
      <h1>GymTrack</h1>
      <p class="subtitle">Front desk overview</p>
    </div>
    <button class="refresh-btn" id="refreshBtn">Refresh</button>
  </header>

  <div class="stats-row" id="statsRow">
    <div class="stat"><div class="value">—</div><div class="label">Total members</div></div>
    <div class="stat active"><div class="value">—</div><div class="label">Active</div></div>
    <div class="stat expiring"><div class="value">—</div><div class="label">Expiring soon</div></div>
    <div class="stat expired"><div class="value">—</div><div class="label">Expired</div></div>
    <div class="stat"><div class="value">—</div><div class="label">Check-ins today</div></div>
  </div>

  <p class="section-title">Members</p>
  <div id="tableWrap">
    <div class="state-message">Loading members…</div>
  </div>

<script>
  const API_BASE = 'http://localhost:8080/api/v1';

  const statusLabels = {
    ACTIVE: 'Active',
    EXPIRING_SOON: 'Expiring soon',
    EXPIRED: 'Expired',
    NONE: 'No subscription'
  };

  function statusBadge(status) {
    const cls = status.toLowerCase();
    const label = statusLabels[status] || status;
    return `<span class="status ${cls}"><span class="dot"></span><span class="label">${label}</span></span>`;
  }

  function planCell(plan) {
    if (!plan) return `<span class="plan-none">No plan</span>`;
    return `<span class="plan-name">${plan.name}</span>`;
  }

  async function loadStats() {
    const statsRow = document.getElementById('statsRow');
    try {
      const res = await fetch(`${API_BASE}/dashboard/stats`);
      if (!res.ok) throw new Error('Request failed');
      const s = await res.json();

      const cells = statsRow.querySelectorAll('.stat .value');
      cells[0].textContent = s.totalMembers;
      cells[1].textContent = s.activeSubscriptions;
      cells[2].textContent = s.expiringSoonSubscriptions;
      cells[3].textContent = s.expiredSubscriptions;
      cells[4].textContent = s.checkInsToday;
    } catch (err) {
      statsRow.querySelectorAll('.stat .value').forEach(c => c.textContent = '–');
    }
  }

  async function loadMembers() {
    const wrap = document.getElementById('tableWrap');
    try {
      const res = await fetch(`${API_BASE}/dashboard/members`);
      if (!res.ok) throw new Error('Request failed');
      const members = await res.json();

      if (members.length === 0) {
        wrap.innerHTML = `<div class="state-message">No members yet.</div>`;
        return;
      }

      const rows = members.map(m => `
        <tr>
          <td class="member-name">${m.fullName}</td>
          <td class="member-phone">${m.phone}</td>
          <td>${planCell(m.plan)}</td>
          <td>${statusBadge(m.status)}</td>
        </tr>
      `).join('');

      wrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Plan</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    } catch (err) {
      wrap.innerHTML = `
        <div class="state-message error">
          Couldn't reach GymTrack at localhost:8080.<br>
          Make sure <code>mvn spring-boot:run</code> is running, and that CORS is enabled for this page's origin.
        </div>
      `;
    }
  }

  function loadAll() {
    loadStats();
    loadMembers();
  }

  document.getElementById('refreshBtn').addEventListener('click', loadAll);
  loadAll();
</script>

</body>
</html>
